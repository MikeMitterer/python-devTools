[build-system]
# Babel übersetzt beim Bauen die Kataloge (setup.py); 77: license als SPDX-Ausdruck mit license-files
requires = ["setuptools>=77", "Babel==2.18.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmit-devtools"
version = "0.2.0"
description = "Check, show and install the pipx development tools a project lists in .dev-tools.conf.sh"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE", "LICENSE.de.txt", "LICENSING.md"]
# Hausregel Mindestversion Python 3.14 (T-8); tests/test_python_version.py hält Doku und Makefile gleich
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/MikeMitterer/python-devtools"

[project.optional-dependencies]
# Farbige Ausgabe nach dem gemeinsamen CLI-Theme und die Leerzeile am Ende jeder Ausgabe (ab
# CLITheme 0.3.0, T-10); ohne das Extra bleibt die Ausgabe reiner Text ohne diesen Abschluss.
# CLITheme führt mmit-devtools nie als Abhängigkeit (kein Zirkel, T-7).
theme = [
    "mmit-cli-theme @ git+https://github.com/MikeMitterer/python-clitheme.git@v0.3.0+261102.1724.ca51d",
]
# Entwicklung: Tests, Lint und Kataloge (make setup); die Tests prüfen auch die Farben (theme)
dev = ["mmit-devtools[theme]", "pytest", "ruff", "Babel==2.18.0"]

[project.scripts]
devtools = "mmit_devtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Die .mo kommen nur aus dem Bauschritt (setup.py), nie aus dem Quellbaum.
mmit_devtools = ["locale/*/LC_MESSAGES/*.po"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
