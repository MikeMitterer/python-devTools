[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mmit-devtools"
version = "0.1.0"
description = "Check, show and install the pipx development tools a project lists in .dev-tools.conf.sh"
readme = "README.md"
# 3.11: tomllib für die Version einer Arbeitskopie
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/MikeMitterer/python-devtools"

[project.optional-dependencies]
# Entwicklung: Tests und Lint (make setup)
dev = ["pytest", "ruff"]

[project.scripts]
devtools = "mmit_devtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
